[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["engineering", "tests/test_engineering.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["aegis", "sharay", "packages", "services"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations"]
