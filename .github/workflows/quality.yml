name: Foundation quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned API and test dependencies
        # Product tests use temporary synthetic loopback fixtures; no target scanner credentials.
        # Desktop PyObjC dependencies are deliberately excluded on Linux CI.
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-dev.txt
      - name: Lint and type check implemented Python source
        run: |
          ruff check aegis sharay packages migrations fixtures tests/product scripts services tests/integration tests/evaluation engineering tests/test_engineering.py
          ruff format --check aegis sharay packages migrations fixtures tests/product scripts services tests/integration tests/evaluation engineering tests/test_engineering.py
          mypy --explicit-package-bases aegis sharay packages services engineering scripts/log_view.py scripts/session_log.py
      - name: Run reviewed unit and integration gate
        # Keep failure evidence even when the preliminary diagnostics step fails.
        if: always()
        run: |
          python engineering/check.py --run-gates
      - name: Retain collector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-evidence-${{ matrix.python }}
          path: .engineering/reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --strict-peer-deps
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit and lint regressions
        run: npm run test
      - name: Static build
        run: npm run build
