version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: sharay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharay_secure_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharay -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sharay_internal

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sharay:${POSTGRES_PASSWORD:-sharay_secure_pass_123}@db:5432/aegis
      AEGIS_DATA_DIR: /app/data
    volumes:
      - sharay_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - sharay_internal
      - sharay_egress

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    command: ["python", "-m", "aegis.worker", "--data-dir", "/app/data"]
    environment:
      DATABASE_URL: postgresql://sharay:${POSTGRES_PASSWORD:-sharay_secure_pass_123}@db:5432/aegis
      AEGIS_DATA_DIR: /app/data
    volumes:
      - sharay_data:/app/data
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    networks:
      - sharay_internal
      - sharay_egress

volumes:
  postgres_data:
  sharay_data:

networks:
  sharay_internal:
    internal: true
  sharay_egress:
